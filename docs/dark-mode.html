<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тёмная тема — lite-foundation docs</title>
    <script>
      // Инлайн в <head> до первой отрисовки — иначе кадр светлой темы мигнёт.
      try {
        const mode = localStorage.getItem('lf-theme');
        if (mode === 'dark' || mode === 'light') {
          document.documentElement.setAttribute('data-theme', mode);
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dist/app.css">
    <link rel="stylesheet" href="assets/docs.css">
  </head>
  <body class="docs-body">
    <div id="app"></div>
    <script type="module" src="./src/entries/dark-mode.jsx"></script>
  </body>
</html>
